version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: proctorai-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: proctorai_db_password
      POSTGRES_DB: proctor_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proctor_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: proctorai-ai-service
    restart: always
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proctorai-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:proctorai_db_password@postgres:5432/proctor_ai?schema=public"
      JWT_SECRET: "proctorai_production_jwt_secret_key_2026"
      AI_SERVICE_URL: "http://ai-service:8000"
      CLIENT_URL: "http://localhost"
    ports:
      - "5000:5000"
    volumes:
      - ./storage/evidence:/app/storage/evidence

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proctorai-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
